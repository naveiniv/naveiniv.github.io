<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NaveiniOS — Naveini Vasikaran</title>
<meta name="description" content="Naveini Vasikaran: content creator and Computer Science student at Queen's University. UGC portfolio, press, projects and resume.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=Silkscreen&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1f2756;
    --paper:#fdf6ea;
    --cream:#f3e9d6;
    --tomato:#c8323b;
    --lilac:#e8b4bb;
    --mint:#b5c99a;
    --butter:#f3e2b3;
    --sky:#cddcbf;
    --bubble:#f6c6cc;
    --shadow:4px 4px 0 var(--ink);
    --pixel:'Silkscreen', monospace;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --serif:'Instrument Serif', Georgia, serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:var(--mono);font-size:14px}
  body{background:var(--cream)}
  body.wp-grid{background:
      radial-gradient(circle at 1px 1px, rgba(27,23,36,.18) 1px, transparent 1.5px) 0 0/18px 18px,
      var(--cream)}
  body.wp-collage{background:#3d4a2e url('wallpaper.jpg') center/cover no-repeat fixed}
  body.wp-collage .wallmark{display:none}
  body.wp-sunset{background:
      repeating-linear-gradient(180deg, transparent 0 22px, rgba(255,255,255,.18) 22px 24px),
      linear-gradient(180deg,#ffb38a 0%,#ff7aa8 45%,#7b5cff 100%)}
  body.wp-check{background:
      conic-gradient(#d9ccff 25%, #fff3d6 0 50%, #d9ccff 0 75%, #fff3d6 0) 0 0/48px 48px}
  body.wp-night{background:
      radial-gradient(circle at 20% 30%, #fff 1px, transparent 1.5px) 0 0/90px 90px,
      radial-gradient(circle at 70% 60%, #fff8 1px, transparent 1.5px) 0 0/60px 60px,
      #17132a}
  
  body.wp-night .wallmark{color:#ffffff22}
  a{color:inherit}
  button{font:inherit;color:inherit}

  /* ---------- boot ---------- */
  #boot{position:fixed;inset:0;background:#1c2419;color:#e4ecd6;z-index:9999;padding:28px;font-family:var(--mono);font-size:14px;line-height:1.7;display:flex;flex-direction:column;justify-content:flex-end}
  #boot .logo{font-family:var(--pixel);font-size:28px;color:var(--butter);margin-bottom:12px}
  #boot .skip{position:absolute;top:18px;right:22px;background:none;border:1px solid #e4ecd655;color:#e4ecd6;padding:6px 10px;cursor:pointer}
  #boot .bar{height:14px;border:2px solid #e4ecd6;width:min(420px,90%);margin-top:10px;padding:2px}
  #boot .bar i{display:block;height:100%;width:0;background:#e4ecd6;transition:width .25s steps(6)}
  #boot.done{opacity:0;pointer-events:none;transition:opacity .4s}

  /* ---------- menu bar ---------- */
  .menubar{position:fixed;top:0;left:0;right:0;height:34px;background:var(--paper);border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:18px;padding:0 14px;z-index:5000;font-family:var(--pixel);font-size:12px}
  .menubar .brand{display:flex;align-items:center;gap:8px;font-size:13px}
  .menubar .brand b{width:16px;height:16px;background:var(--tomato);border:2px solid var(--ink);border-radius:50%;display:inline-block}
  .menubar button.mi{background:none;border:0;cursor:pointer;padding:4px 6px;font-family:var(--pixel);font-size:12px}
  .menubar button.mi:hover{background:var(--ink);color:var(--paper)}
  .menubar .spacer{flex:1}
  .menubar .status{display:flex;align-items:center;gap:6px}
  .menubar .dot{width:9px;height:9px;border-radius:50%;background:#2fd17a;border:1.5px solid var(--ink);animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.35}}

  /* ---------- desktop ---------- */
  #desktop{position:fixed;top:34px;left:0;right:0;bottom:52px}
  .wallmark{position:absolute;right:4vw;bottom:2vh;font-family:var(--serif);font-style:italic;font-size:clamp(70px,13vw,210px);line-height:.85;color:#1f275612;text-align:right;pointer-events:none;user-select:none;letter-spacing:-.02em}
  .icons{position:absolute;top:14px;left:14px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,124px);gap:4px 8px;height:calc(100% - 28px)}
  .icon{width:116px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:6px 2px;border-radius:4px}
  .icon svg{width:72px;height:72px;filter:drop-shadow(2px 2px 0 var(--ink))}
  .icon span{font-family:'Satoshi','Manrope',sans-serif;font-weight:700;font-size:14px;line-height:1.15;text-align:center;padding:1px 4px;color:#ffd6e0;text-shadow:0 1px 2px #1f2756,0 0 6px #1f2756cc,0 0 2px #1f2756}
  .icon img{width:80px;height:80px;object-fit:contain;filter:drop-shadow(0 0 2px #fdf6ea) drop-shadow(0 0 5px #fdf6eacc) drop-shadow(2px 3px 0 rgba(31,39,86,.3));transition:transform .15s}
  .icon:hover img{transform:translateY(-3px) rotate(-3deg)}
  .icon img[src='icon-swan.png']{border:2px solid var(--ink);border-radius:6px;background:#fdf6ea;height:60px;margin:10px 0}
  .icon:hover span,.icon:focus-visible span{color:#fff}
  .icon:focus-visible{outline:none}

  .sticky{position:absolute;top:30px;right:6vw;width:230px;background:var(--butter);border:2px solid var(--ink);box-shadow:var(--shadow);padding:16px 16px 14px;transform:rotate(2.5deg);font-size:13px;line-height:1.5;z-index:2;cursor:grab;touch-action:none}
  .sticky:before{content:"";position:absolute;top:-12px;left:50%;width:70px;height:22px;transform:translateX(-50%) rotate(-3deg);background:#ffffff99;border:1px dashed #1f275655}
  .sticky h3{font-family:var(--serif);font-weight:400;font-size:28px;margin:0 0 6px;line-height:1}
  .sticky em{font-family:var(--serif);font-size:17px}

  /* ---------- windows ---------- */
  .win{position:absolute;background:var(--paper);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);min-width:280px;display:flex;flex-direction:column;max-height:calc(100% - 20px);animation:pop .18s steps(3)}
  @keyframes pop{from{transform:scale(.92);opacity:.3}}
  .win.closing{animation:close .14s steps(3) forwards}
  @keyframes close{to{transform:scale(.9);opacity:0}}
  .titlebar{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:2px solid var(--ink);cursor:grab;user-select:none;touch-action:none;background:var(--tb,var(--lilac))}
  .win:not(.active) .titlebar{background:repeating-linear-gradient(90deg,var(--paper) 0 3px,#e8e0cf 3px 4px)}
  .titlebar .t{font-family:var(--pixel);font-size:12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .titlebar button{width:20px;height:20px;border:2px solid var(--ink);background:var(--paper);cursor:pointer;display:grid;place-items:center;padding:0;font-family:var(--pixel);font-size:10px;line-height:1}
  .titlebar button:hover{background:var(--ink);color:var(--paper)}
  .content{overflow:auto;padding:18px 20px;line-height:1.6}
  .content h2{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1;margin:0 0 10px;letter-spacing:-.01em}
  .content h2 i{color:var(--tomato)}
  .content h4{font-family:var(--pixel);font-weight:400;font-size:12px;margin:18px 0 8px;letter-spacing:.04em}
  .content p{margin:0 0 10px}
  .tag{display:inline-block;border:1.5px solid var(--ink);padding:1px 8px;margin:0 4px 6px 0;font-size:12px;background:var(--paper)}
  .btn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);background:var(--butter);padding:8px 14px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);text-decoration:none;font-weight:600;font-size:13px}
  .btn:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
  .btn:active{transform:translate(3px,3px);box-shadow:none}
  .btn.alt{background:var(--paper)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  /* about */
  .about{display:grid;grid-template-columns:150px 1fr;gap:20px}
  .avatar{width:150px;aspect-ratio:3/4;border:2px solid var(--ink);background:
      repeating-linear-gradient(45deg,var(--bubble) 0 10px,#fbdade 10px 20px);display:grid;place-items:center;font-family:var(--serif);font-size:64px;font-style:italic;box-shadow:var(--shadow);position:relative}
  .avatar small{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-family:var(--pixel);font-size:9px;font-style:normal}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
  .card{border:2px solid var(--ink);padding:12px;background:#fff}
  .card b{font-family:var(--pixel);font-weight:400;font-size:11px;display:block;margin-bottom:4px}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .stat{border:2px solid var(--ink);padding:14px;background:var(--bg,#fff)}
  .stat .n{font-family:var(--serif);font-size:52px;line-height:1}
  .stat .l{font-family:var(--pixel);font-size:10px;margin-top:6px}
  .meter{height:16px;border:2px solid var(--ink);margin-top:14px;background:#fff;overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--tomato) 0 8px,#e0646b 8px 10px);transition:width 1.6s steps(20)}

  /* portfolio */
  .reel{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
  .clip{border:2px solid var(--ink);background:var(--c,#222);aspect-ratio:9/16;position:relative;overflow:hidden;cursor:pointer;text-decoration:none;color:var(--ink);display:block}
  .clip:hover{transform:rotate(-1.5deg)}
  .clip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .clip .rec,.clip .cap{z-index:1}
  .clip .rec{position:absolute;top:8px;left:8px;font-family:var(--pixel);font-size:9px;display:flex;align-items:center;gap:4px;background:var(--paper);border:1.5px solid var(--ink);padding:1px 5px}
  .clip .rec:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--tomato)}
  .clip .play{position:absolute;inset:0;display:grid;place-items:center}
  .clip .play i{width:46px;height:46px;border:2px solid var(--ink);background:var(--paper);border-radius:50%;display:grid;place-items:center}
  .clip .play i:after{content:"";border-left:14px solid var(--ink);border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
  .clip .cap{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--ink);padding:6px 8px;font-size:11.5px;line-height:1.3}
  .clip .cap b{display:block;font-family:var(--pixel);font-weight:400;font-size:10px}
  .clip .brackets:before,.clip .brackets:after{content:"";position:absolute;width:22px;height:22px;border:2px solid var(--paper)}
  .clip .brackets:before{top:36px;right:10px;border-left:0;border-bottom:0}
  .clip .brackets:after{bottom:66px;left:10px;border-right:0;border-top:0}
  .note{font-size:12px;opacity:.75;margin-top:12px}

  /* brands */
  .apps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .app{border:2px solid var(--ink);padding:14px 12px;text-align:center;background:#fff}
  .app .glyph{width:54px;height:54px;margin:0 auto 10px;border:2px solid var(--ink);border-radius:14px;display:grid;place-items:center;font-family:var(--serif);font-size:30px;box-shadow:3px 3px 0 var(--ink)}
  .app b{font-family:var(--pixel);font-weight:400;font-size:11px;display:block}
  .app small{font-size:11px;opacity:.7}
  .slot{border-style:dashed;background:transparent;display:grid;place-items:center;font-size:12px;cursor:pointer}
  .slot:hover{background:var(--butter)}

  /* projects */
  .proj{border:2px solid var(--ink);padding:14px;margin-bottom:12px;background:#fff;display:grid;grid-template-columns:44px 1fr;gap:12px}
  .proj .pi{width:44px;height:44px;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--pixel);font-size:14px}
  .proj b{font-size:14px}

  /* terminal */
  .term{background:#1c2419;color:#e4ecd6;font-family:var(--mono);font-size:13px;padding:14px;height:330px;overflow:auto;line-height:1.55}
  .term .p{color:var(--butter)}
  .term .o{color:#f6ead8;white-space:pre-wrap}
  .term .err{color:#ff8f7a}
  .term input{background:none;border:0;outline:none;color:#e4ecd6;font:inherit;width:70%;caret-color:var(--butter)}

  /* brief form */
  form.brief{display:grid;gap:12px}
  form.brief label{font-family:var(--pixel);font-size:10.5px;display:grid;gap:5px}
  form.brief input,form.brief select,form.brief textarea{font:inherit;font-size:13px;border:2px solid var(--ink);padding:8px 10px;background:#fff;width:100%}
  form.brief textarea{min-height:90px;resize:vertical}
  form.brief input:focus,form.brief select:focus,form.brief textarea:focus{outline:none;box-shadow:3px 3px 0 var(--lilac)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .toast{border:2px solid var(--ink);background:var(--mint);padding:10px 12px;font-size:12.5px;display:none}
  .toast.show{display:block}

  /* settings */
  .walls{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px}
  .walls button{aspect-ratio:4/3;border:2px solid var(--ink);cursor:pointer}
  .walls button.on{outline:3px solid var(--tomato);outline-offset:2px}

  /* resume */
  .resume-doc{background:#fff;border:2px solid var(--ink);padding:22px 24px;box-shadow:var(--shadow)}
  .resume-doc h3{font-family:var(--serif);font-weight:400;font-size:34px;margin:0}
  .resume-doc hr{border:0;border-top:2px solid var(--ink);margin:12px 0}

  /* trash */
  .trash li{margin-bottom:6px}
  .trash s{opacity:.6}

  /* strawberry sweeper */
  .sw-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;font-family:var(--pixel);font-size:12px}
  .sw-top .lcd{background:var(--ink);color:#f6c6cc;padding:4px 8px;min-width:54px;text-align:center}
  .sw-top button{border:2px solid var(--ink);background:var(--paper);cursor:pointer;padding:4px 8px;font-size:16px;box-shadow:2px 2px 0 var(--ink)}
  .sw-top button.on{background:var(--mint);box-shadow:inset 2px 2px 0 var(--ink)}
  .sw-board{display:grid;grid-template-columns:repeat(9,34px);gap:0;border:2px solid var(--ink);width:max-content;margin:0 auto;user-select:none;touch-action:manipulation}
  .sw-board button{width:34px;height:34px;border:1px solid #1f275633;background:var(--butter);box-shadow:inset -3px -3px 0 #d9b878, inset 3px 3px 0 #fffaf0;cursor:pointer;font-family:var(--pixel);font-size:14px;padding:0;display:grid;place-items:center}
  .sw-board button:hover{background:#f8ecc8}
  .sw-board button.r{background:#fdf6ea;box-shadow:none;cursor:default}
  .sw-board button.boom{background:var(--tomato)}
  .sw-board .n1{color:#5f7a4a}.sw-board .n2{color:#1f2756}.sw-board .n3{color:#c8323b}.sw-board .n4{color:#7b3f8f}.sw-board .n5{color:#8a4b1f}.sw-board .n6,.sw-board .n7,.sw-board .n8{color:#1f2756}
  .sw-msg{text-align:center;margin-top:10px;font-size:13px;min-height:20px}

  /* study buddy */
  .study{display:grid;grid-template-columns:210px 1fr;gap:16px}
  .stage{border:2px solid var(--ink);height:210px;position:relative;overflow:hidden;background:
      radial-gradient(ellipse at 50% 100%, #9fb487 0 34%, transparent 35%),
      linear-gradient(180deg,#f6e3e3 0%,#fdf6ea 60%,#cddcbf 60%,#b5c99a 100%)}
  .pethome{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);transition:width .4s}
  .pethome svg{width:100%;height:auto;display:block}
  .pethome.bounce{animation:hop .5s}
  @keyframes hop{30%{transform:translate(-50%,-18px)}60%{transform:translate(-50%,0)}75%{transform:translate(-50%,-6px)}}
  .speech{position:absolute;top:8px;left:8px;right:8px;background:#fff;border:2px solid var(--ink);padding:5px 8px;font-size:12px;line-height:1.35;min-height:20px}
  .speech:empty{display:none}
  .petname{font-family:var(--serif);font-size:30px;line-height:1;outline:none;border-bottom:2px dashed transparent}
  .petname:focus{border-bottom-color:var(--ink)}
  .petsub{font-family:var(--pixel);font-size:10px;margin:2px 0 12px}
  .barl{font-family:var(--pixel);font-size:10px;display:flex;justify-content:space-between;margin-top:8px}
  .pbar{height:14px;border:2px solid var(--ink);background:#fff;margin-top:3px}
  .pbar i{display:block;height:100%;transition:width .4s}
  .btn.sm{padding:5px 10px;font-size:12px;box-shadow:2px 2px 0 var(--ink)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .berries{font-family:var(--pixel);font-size:12px;border:2px solid var(--ink);padding:4px 8px;background:#fff}
  .focusbox{border:2px solid var(--ink);margin-top:16px;padding:14px;background:#fff;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
  .clockface{font-family:var(--pixel);font-size:40px;line-height:1;padding:10px 12px;background:var(--ink);color:#f6c6cc;min-width:150px;text-align:center}
  .clockface small{display:block;font-size:10px;color:#cddcbf;margin-top:6px}
  .presets button{border:2px solid var(--ink);background:var(--paper);padding:4px 9px;cursor:pointer;font-size:12px}
  .presets button.on{background:var(--mint)}
  .studystats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

  /* desktop pet */
  .deskpet{position:fixed;bottom:50px;left:40px;width:58px;z-index:4999;cursor:pointer;user-select:none}
  .deskpet .body{transform-origin:50% 100%}
  .deskpet .body svg{width:58px;height:auto;display:block;filter:drop-shadow(2px 2px 0 #1f275655)}
  .deskpet.walk .body{animation:bob .36s steps(2) infinite}
  @keyframes bob{50%{transform:translateY(-3px)}}
  .deskpet.hop .body{animation:dhop .5s}
  @keyframes dhop{40%{transform:translateY(-22px)}}
  .deskpet .say{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:4px;background:#fff;border:2px solid var(--ink);padding:4px 8px;font-size:11.5px;white-space:nowrap;display:none;box-shadow:2px 2px 0 var(--ink)}
  .deskpet .say.show{display:block}
  .heart{position:fixed;z-index:5002;pointer-events:none;font-size:16px;animation:floatup 1s forwards}
  @keyframes floatup{to{transform:translateY(-40px);opacity:0}}
  @media (max-width:720px){
    .study,.focusbox{grid-template-columns:1fr}
    .clockface{min-width:0}
    .sw-board{grid-template-columns:repeat(9,32px)}
    .sw-board button{width:32px;height:32px}
  }

  /* taskbar */
  .taskbar{position:fixed;left:0;right:0;bottom:0;height:52px;background:var(--paper);border-top:2px solid var(--ink);display:flex;align-items:center;gap:8px;padding:0 10px;z-index:5000}
  .start{font-family:var(--pixel);font-size:12px;border:2px solid var(--ink);background:var(--tomato);color:var(--paper);padding:7px 12px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);display:flex;gap:7px;align-items:center}
  .start:active{transform:translate(3px,3px);box-shadow:none}
  .tasks{display:flex;gap:6px;overflow-x:auto;flex:1}
  .task{border:2px solid var(--ink);background:#fff;padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis}
  .task.on{background:var(--lilac);box-shadow:inset 2px 2px 0 var(--ink)}
  .clock{font-family:var(--pixel);font-size:11px;border:2px solid var(--ink);padding:6px 10px;background:#fff;white-space:nowrap}

  .startmenu{position:fixed;bottom:58px;left:10px;width:260px;background:var(--paper);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);z-index:5001;display:none}
  .startmenu.open{display:flex}
  .startmenu .side{writing-mode:vertical-rl;transform:rotate(180deg);background:var(--ink);color:var(--butter);font-family:var(--pixel);font-size:13px;padding:10px 6px;text-align:left}
  .startmenu ul{list-style:none;margin:0;padding:6px;flex:1}
  .startmenu li button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;cursor:pointer;font-size:13px;display:flex;gap:10px;align-items:center}
  .startmenu li button:hover{background:var(--lilac)}
  .startmenu hr{border:0;border-top:2px dashed #1f275644;margin:4px 0}

  /* mobile */
  @media (max-width:720px){
    html,body{overflow:auto}
    .menubar .hide-sm{display:none}
    .icons{position:static;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-flow:row;grid-template-rows:none;height:auto;padding:18px 10px;gap:10px}
    .icon{width:auto}
    .icon img,.icon svg{width:62px;height:62px}
    .icon span{font-size:12.5px}

    const el = document.createElement('section');

    el.innerHTML = `<div class="titlebar"><span class="t">${cfg.title}</span>

    open[id] = {el, task};

    el.querySelector('.x').onclick = e => { e.stopPropagation(); closeWin(id); };
    el.querySelector('.min').onclick = e => { e.stopPropagation(); el.style.display='none'; task.classList.remove('on'); el.classList.remove('active'); };
    makeDraggable(el, el.querySelector('.titlebar'));
    focusWin(id);
    init[id] && init[id](el);

  function makeDraggable(el, handle, bounded=true){
    let sx, sy, ox, oy, dragging=false;
    handle.addEventListener('pointerdown', e => {
      if(mobile() || e.target.closest('button')) return;
      dragging=true; sx=e.clientX; sy=e.clientY; ox=el.offsetLeft; oy=el.offsetTop;
      handle.setPointerCapture(e.pointerId); handle.style.cursor='grabbing';
    });
    handle.addEventListener('pointermove', e => {
      if(!dragging) return;
      let nx = ox + e.clientX - sx, ny = oy + e.clientY - sy;
      if(bounded){
        nx = Math.max(-el.offsetWidth+80, Math.min(desktop.clientWidth-80, nx));
        ny = Math.max(0, Math.min(desktop.clientHeight-40, ny));
      }
      el.style.left = nx+'px'; el.style.top = ny+'px'; el.style.right='auto';
    });
    const end = () => { dragging=false; handle.style.cursor=''; };
    handle.addEventListener('pointerup', end); handle.addEventListener('pointercancel', end);
  }

  function sweeper(el){
    const N=9, M=10, $=s=>el.querySelector(s);
    const board=$('#swBoard'), msg=$('#swMsg'), leftEl=$('#swLeft'), timeEl=$('#swTime'), resetBtn=$('#swReset'), flagBtn=$('#swFlag');
    let mines, rev, flag, placed, over, t0, timer, flagMode=false, cells=[];
    const nb = i => { const r=Math.floor(i/N), c=i%N, out=[]; for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){ if(!dr&&!dc)continue; const rr=r+dr, cc=c+dc; if(rr>=0&&rr<N&&cc>=0&&cc<N) out.push(rr*N+cc);} return out; };
    const count = i => nb(i).filter(j=>mines[j]).length;
    function reset(){
      mines=Array(N*N).fill(false); rev=Array(N*N).fill(false); flag=Array(N*N).fill(false);
      placed=false; over=false; clearInterval(timer); timeEl.textContent='000'; resetBtn.textContent='🐰';
      msg.textContent="10 strawberries are hiding. Don't squish them! Right-click (or long-press, or 🌿 mode) to mark one with a leaf.";
      board.innerHTML=''; cells=[];
      for(let i=0;i<N*N;i++){
        const b=document.createElement('button'); b.setAttribute('aria-label','hidden cell');
        let lp, longed=false;
        b.addEventListener('pointerdown', e => { if(e.pointerType!=='mouse'){ longed=false; lp=setTimeout(()=>{ longed=true; toggleFlag(i); }, 420); } });
        b.addEventListener('pointerup', () => clearTimeout(lp));
        b.addEventListener('pointerleave', () => clearTimeout(lp));
        b.addEventListener('click', () => { if(longed){ longed=false; return; } flagMode ? toggleFlag(i) : open(i); });
        b.addEventListener('contextmenu', e => { e.preventDefault(); toggleFlag(i); });
        board.appendChild(b); cells.push(b);
      }
      update();
    }
    function place(first){
      const safe=new Set([first,...nb(first)]); let n=0;
      while(n<M){ const i=Math.floor(Math.random()*N*N); if(!mines[i]&&!safe.has(i)){ mines[i]=true; n++; } }
      placed=true; t0=Date.now();
      timer=setInterval(()=>{ timeEl.textContent=String(Math.min(999,Math.floor((Date.now()-t0)/1000))).padStart(3,'0'); },500);
    }
    function toggleFlag(i){ if(over||rev[i]) return; flag[i]=!flag[i]; update(); }
    function open(i){
      if(over||flag[i]||rev[i]) return;
      if(!placed) place(i);
      if(mines[i]){ lose(i); return; }
      const q=[i];
      while(q.length){ const k=q.pop(); if(rev[k]||flag[k]) continue; rev[k]=true; if(count(k)===0) nb(k).forEach(j=>{ if(!rev[j]&&!mines[j]) q.push(j); }); }
      update();
      if(rev.filter(Boolean).length===N*N-M) win();
    }
    function lose(i){
      over=true; clearInterval(timer); resetBtn.textContent='😵';
      mines.forEach((m,j)=>{ if(m) rev[j]=true; }); update(); cells[i].classList.add('boom');
      msg.textContent='Squish! 🍓💥 You stepped on a strawberry. Tap the bunny to try again.';
    }
    function win(){
      over=true; clearInterval(timer); resetBtn.textContent='😎';
      mines.forEach((m,j)=>{ if(m) flag[j]=true; }); update();
      const secs=Math.floor((Date.now()-t0)/1000);
      let best; try{ best=+localStorage.getItem('naveinios-sweep-best')||0; if(!best||secs<best){ localStorage.setItem('naveinios-sweep-best',secs); best=secs; } }catch{}
      msg.textContent=`You saved every strawberry in ${secs}s! 🍓✨${best?` Best: ${best}s`:''}`;
      PET.happy=clamp(PET.happy+5); savePet();
    }
    function update(){
      cells.forEach((b,i)=>{
        b.className=''; b.textContent='';
        if(rev[i]){ b.classList.add('r');
          if(mines[i]){ b.textContent='🍓'; }
          else { const n=count(i); if(n){ b.textContent=n; b.classList.add('n'+n); } }
        } else if(flag[i]) b.textContent='🌿';
      });
      leftEl.textContent='🍓 '+(M-flag.filter(Boolean).length);
    }
    resetBtn.onclick=reset;
    flagBtn.onclick=()=>{ flagMode=!flagMode; flagBtn.classList.toggle('on',flagMode); };
    reset();
  }

  // ================= DESKTOP PET =================
  (function deskPet(){
    const dp=document.createElement('div'); dp.className='deskpet';
    dp.innerHTML='<div class="say"></div><div class="body"></div>';
    document.body.appendChild(dp);
    const body=dp.querySelector('.body'), say=dp.querySelector('.say');
    let x=40, target=40, dir=1, idleUntil=0, last=performance.now(), mood='', sayTimer;
    function draw(){ const m=petMood(); if(m!==mood){ mood=m; body.innerHTML=bunnySVG(m==='focus'?'happy':m, m==='focus'); } }
    renderers.add(draw); draw();
    function speak(t, ms=2800){ say.textContent=t; say.classList.add('show'); clearTimeout(sayTimer); sayTimer=setTimeout(()=>say.classList.remove('show'), ms); }
    function step(now){
      const dt=Math.min(.1,(now-last)/1000); last=now;
      const maxX=window.innerWidth-70;
      if(PET.focus && PET.focus.type==='focus'){ dp.classList.remove('walk'); }
      else if(now>idleUntil){
        if(Math.abs(target-x)<2){
          idleUntil=now+2000+Math.random()*5000;
          target=Math.max(10,Math.min(maxX, 10+Math.random()*maxX));
          dp.classList.remove('walk');
        } else {
          dir = target>x ? 1 : -1;
          x += dir*45*dt; dp.classList.add('walk');
        }
      }
      x=Math.max(10,Math.min(maxX,x));
      dp.style.transform=`translateX(${x-40}px)`;
      body.style.scale = `${dir} 1`;
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
    dp.addEventListener('click', e => {
      dp.classList.remove('hop'); void dp.offsetWidth; dp.classList.add('hop');
      heart(e.clientX, e.clientY);
      PET.happy=clamp(PET.happy+1); savePet();
      const m=petMood();
      const lines = m==='hungry' ? ["i'm hungry… study with me? 🍓", 'strawberry pls 🥺']
        : m==='focus' ? ["shh, we're studying 📖", 'focus mode on 🤓']
        : m==='sleep' ? ['zzz…', "it's late, go to bed!"]
        : [`hi! I'm ${PET.name} ✿`, 'study together? 📚', 'try the strawberry game 🍓', 'you look cute today', 'hire her!! 💼'];
      speak(lines[Math.floor(Math.random()*lines.length)]);
      if(e.detail===2) openWin('study');
    });
    dp.title='Double-click to open Study Buddy';
    setTimeout(()=>speak(`hi! I'm ${PET.name} 🍓`), 2600);
  })();

  // ---------- global wiring ----------
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-open]');
    if(t){ openWin(t.dataset.open); }
  });

  const startBtn = document.getElementById('startBtn'), startmenu = document.getElementById('startmenu');
  function closeStart(){ startmenu.classList.remove('open'); startBtn.setAttribute('aria-expanded','false'); }
  startBtn.onclick = e => { e.stopPropagation(); const o = startmenu.classList.toggle('open'); startBtn.setAttribute('aria-expanded', o); };
  document.addEventListener('pointerdown', e => { if(!e.target.closest('#startmenu,#startBtn')) closeStart(); });
  document.getElementById('tidy').onclick = () => Object.keys(open).forEach(closeWin);
  document.addEventListener('keydown', e => {
    if(e.key==='Escape'){ const top = Object.entries(open).filter(([,o])=>o.el.style.display!=='none').sort((a,b)=>b[1].el.style.zIndex-a[1].el.style.zIndex)[0]; if(top) closeWin(top[0]); closeStart(); }
  });

  // sticky note drag
  const sticky = document.getElementById('sticky');
  makeDraggable(sticky, sticky, false);

  // clock
  const clock = document.getElementById('clock');
  const tick = () => clock.textContent = new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  tick(); setInterval(tick, 15000);

  // remembered wallpaper
  try{ const wp = localStorage.getItem('naveinios-wp'); if(wp) document.body.className = document.body.className.replace(/wp-\w+/, wp); }catch{}

  // ---------- boot ----------
  const boot = document.getElementById('boot'), linesEl = document.getElementById('bootLines'), bar = document.getElementById('bootBar');
  const lines = ['> loading creativity.dll ........ ok','> mounting /portfolio (20M+ views) ok','> compiling queens_computing.java  ok','> calibrating ring light .......... ok','> welcome, visitor ✿'];
  let seen = false; try{ seen = sessionStorage.getItem('naveinios-booted'); }catch{}
  function finishBoot(){
    boot.classList.add('done'); setTimeout(() => boot.remove(), 450);
    try{ sessionStorage.setItem('naveinios-booted','1'); }catch{}
    if(!mobile()) setTimeout(() => openWin('about'), 250);
  }
  document.getElementById('skipBoot').onclick = finishBoot;
  if(seen || window.matchMedia('(prefers-reduced-motion:reduce)').matches){ finishBoot(); }
  else {
    let i = 0;
    const next = () => {
      if(!document.body.contains(boot)) return;
      if(i < lines.length){ const d=document.createElement('div'); d.textContent=lines[i]; linesEl.appendChild(d); bar.style.width = ((i+1)/lines.length*100)+'%'; i++; setTimeout(next, 330); }
      else setTimeout(finishBoot, 450);
    };
    setTimeout(next, 250);
  }
})();
</script>
